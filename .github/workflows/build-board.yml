name: Board refresh

on:
  schedule:
    # Three refreshes a day, all free. ADP moves daily; injuries and depth
    # charts move intraday — the evening run is the one that matters before
    # draft night. Sources refuse nothing: all anonymous, no keys.
    - cron: "20 9 * * *" # 09:20 UTC — after FFC's daily ADP refresh
    - cron: "20 16 * * *" # 16:20 UTC — midday injury/depth updates
    - cron: "20 23 * * *" # 23:20 UTC — pre-draft-night (evening US)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-board:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:board
        env:
          # Optional: live FantasyPros consensus ranks. Set via
          # `gh secret set FANTASYPROS_API_KEY` — absent, the build falls
          # back to the DynastyProcess weekly mirror.
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
      - name: Commit refreshed board + fixtures
        run: |
          git config user.name "board-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data data/raw
          git diff --cached --quiet || git commit -m "chore: nightly board refresh"
          git push
